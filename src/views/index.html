<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SisEventos - Acesso</title>
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>

    <div class="hero-section">
      <div class="fundo-conexoes"></div>
      <div class="hero-content">
        <h1 class="hero-title">SisEventos</h1>
        <p class="hero-subtitle">Gestão académica de eventos.<br>Descubra, inscreva-se e participe.</p>
      </div>
    </div>

    <div class="login-section">
      <div class="form-container">

        <!-- Formulário de Login -->
        <div class="form-content login-content">
          <div class="brand-logo">SisEventos</div>
          <div class="form-header">
            <h2>Bem-vindo(a) de volta!</h2>
            <p>Não tem uma conta ainda? <a href="#" id="btn-sign-up">Crie uma nova conta agora.</a></p>
          </div>
          <form id="loginForm">
            <div class="input-group">
              <input type="email" id="email-login" placeholder="E-MAIL" required>
            </div>
            <div class="input-group">
              <input type="password" id="password-login" placeholder="SENHA" required>
            </div>
            <button type="submit" class="btn-primary">Entrar no Sistema</button>
          </form>
        </div>

        <!-- Formulário de Registo -->
        <div class="form-content register-content">
          <div class="brand-logo">SisEventos</div>
          <div class="form-header">
            <h2>Criar nova conta</h2>
            <p>Já tem uma conta? <a href="#" id="btn-sign-in">Entre agora.</a></p>
          </div>
          <form id="registerForm">
            <div class="input-row">
              <div class="input-group">
                <input type="text" id="nome" placeholder="NOME" required>
              </div>
              <div class="input-group">
                <input type="text" id="sobrenome" placeholder="SOBRENOME" required>
              </div>
            </div>
            <div class="input-group">
              <input type="email" id="email-register" placeholder="E-MAIL" required>
            </div>
            <div class="input-group">
              <input type="password" id="password-register" placeholder="SENHA" required>
            </div>
            <div class="input-group">
              <input type="password" id="password-confirm" placeholder="CONFIRMAR SENHA" required>
            </div>
            <button type="submit" class="btn-primary">Registar e Continuar</button>
          </form>
        </div>

      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
